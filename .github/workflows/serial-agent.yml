name: Serial Agent

on:
  push:
    branches: [main]
    paths:
      - 'serial-agent/**'
      - '.github/workflows/serial-agent.yml'
  pull_request:
    branches: [main]
    paths:
      - 'serial-agent/**'
      - '.github/workflows/serial-agent.yml'

concurrency:
  group: serial-agent-${{ github.ref }}
  cancel-in-progress: true

jobs:
  win64:
    name: Build Win64 serial-agent.exe
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: serial-agent

      - name: Test
        run: cargo test --manifest-path serial-agent/Cargo.toml

      - name: Build Win64 executable
        run: cargo build --manifest-path serial-agent/Cargo.toml --release --target x86_64-pc-windows-msvc

      - name: Stage executable for NativePHP extras
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force extras/serial-agent
          Copy-Item serial-agent/target/x86_64-pc-windows-msvc/release/serial-agent.exe extras/serial-agent/serial-agent.exe

      - name: Upload executable
        uses: actions/upload-artifact@v4
        with:
          name: serial-agent-win64
          path: extras/serial-agent/serial-agent.exe
          if-no-files-found: error
