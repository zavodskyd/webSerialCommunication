name: Windows NativePHP Build

on:
  workflow_dispatch:
  push:
    tags:
      - '*.*.*'
    paths:
      - 'app/**'
      - 'bootstrap/**'
      - 'config/**'
      - 'database/**'
      - 'nativephp/**'
      - 'public/**'
      - 'resources/**'
      - 'routes/**'
      - 'serial-agent/**'
      - '.github/workflows/serial-agent.yml'
      - 'composer.json'
      - 'composer.lock'
      - 'package.json'
      - 'package-lock.json'
      - 'vite.config.js'
  pull_request:
    branches: [main]
    paths:
      - 'app/**'
      - 'bootstrap/**'
      - 'config/**'
      - 'database/**'
      - 'nativephp/**'
      - 'public/**'
      - 'resources/**'
      - 'routes/**'
      - 'serial-agent/**'
      - '.github/workflows/serial-agent.yml'
      - 'composer.json'
      - 'composer.lock'
      - 'package.json'
      - 'package-lock.json'
      - 'vite.config.js'

permissions:
  contents: write
concurrency:
  group: windows-nativephp-${{ github.ref }}
  cancel-in-progress: true

jobs:
  win64:
    name: Build Win64 app with serial-agent.exe
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6

      - name: Resolve app version
        id: app-version
        shell: pwsh
        run: |
          if ('${{ github.ref }}'.StartsWith('refs/tags/')) {
            $version = '${{ github.ref_name }}'
          }
          elseif ('${{ github.event_name }}' -eq 'pull_request') {
            $version = '0.0.${{ github.run_number }}-pr.${{ github.event.pull_request.number }}'
          }
          else {
            $version = '0.0.${{ github.run_number }}-ci'
          }

          "value=$version" >> $env:GITHUB_OUTPUT
          Write-Host "Resolved app version: $version"

      - name: Validate release tag format
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        run: |
          $tag = '${{ github.ref_name }}'
          if ($tag -notmatch '^\d{4}\.\d+\.\d+$') {
            Write-Error "Invalid tag format '$tag'. Expected format: 2026.1.0"
            exit 1
          }

      - name: Setup PHP 8.3
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, sqlite, pdo_sqlite, intl, dom, fileinfo, zip
          coverage: none
          tools: composer:v2

      - name: Setup Node 22
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: 'npm'

      - name: Restore cached serial-agent executable
        id: serial-agent-binary-cache
        uses: actions/cache@v5
        with:
          path: extras/serial-agent/serial-agent.exe
          key: windows-serial-agent-x64-msvc-v1-${{ hashFiles('serial-agent/**') }}

      - name: Setup Rust
        if: ${{ steps.serial-agent-binary-cache.outputs.cache-hit != 'true' }}
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Get composer cache directory
        id: composer-cache
        shell: pwsh
        run: echo "dir=$(composer config cache-files-dir)" >> $env:GITHUB_OUTPUT

      - name: Cache composer dependencies
        uses: actions/cache@v5
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: ${{ runner.os }}-php-8.3-composer-${{ hashFiles('**/composer.lock') }}
          restore-keys: |
            ${{ runner.os }}-php-8.3-composer-

      - name: Cache Cargo
        if: ${{ steps.serial-agent-binary-cache.outputs.cache-hit != 'true' }}
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            serial-agent -> target

      - name: Ensure bootstrap cache directory exists
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force bootstrap/cache | Out-Null

      - name: Install composer dependencies
        env:
          COMPOSER_MAX_PARALLEL_HTTP: 1
        run: composer install --prefer-dist --no-progress --no-interaction --no-dev --optimize-autoloader

      - name: Install npm dependencies
        run: npm ci

      - name: Prepare production environment
        shell: pwsh
        run: |
          Copy-Item .env.example .env
          php artisan key:generate --no-interaction
          $envContent = Get-Content .env
          $envContent = $envContent `
            -replace '^APP_ENV=.*', 'APP_ENV=production' `
            -replace '^APP_DEBUG=.*', 'APP_DEBUG=false' `
            -replace '^SERIAL_DRIVER=.*', 'SERIAL_DRIVER=rust-agent'

          if ($envContent -match '^NATIVEPHP_APP_VERSION=.*') {
            $envContent = $envContent -replace '^NATIVEPHP_APP_VERSION=.*', 'NATIVEPHP_APP_VERSION=${{ steps.app-version.outputs.value }}'
          }
          else {
            $envContent += 'NATIVEPHP_APP_VERSION=${{ steps.app-version.outputs.value }}'
          }

          $envContent | Set-Content .env

      - name: Verify fresh production database schema
        shell: pwsh
        run: |
          $databasePath = Join-Path $env:RUNNER_TEMP 'nativephp-schema.sqlite'
          New-Item -ItemType File -Force $databasePath | Out-Null
          $env:DB_CONNECTION = 'sqlite'
          $env:DB_DATABASE = $databasePath
          php artisan migrate:fresh --force --no-interaction
          php artisan db:seed --force --no-interaction
          php artisan migrate:status --no-interaction

      - name: Verify resolved app version
        shell: pwsh
        run: |
          Get-Content .env | Select-String '^NATIVEPHP_APP_VERSION='
          if ('${{ github.ref }}'.StartsWith('refs/tags/')) {
            $expected = 'NATIVEPHP_APP_VERSION=${{ github.ref_name }}'
            $actual = Get-Content .env | Select-String '^NATIVEPHP_APP_VERSION=' | ForEach-Object { $_.Line }

            if ($actual -ne $expected) {
              Write-Error "Expected '$expected' but found '$actual'"
              exit 1
            }
          }

      - name: Test Rust agent
        if: ${{ steps.serial-agent-binary-cache.outputs.cache-hit != 'true' }}
        run: cargo test --manifest-path serial-agent/Cargo.toml --locked

      - name: Build Win64 executable
        if: ${{ steps.serial-agent-binary-cache.outputs.cache-hit != 'true' }}
        run: cargo build --manifest-path serial-agent/Cargo.toml --release --target x86_64-pc-windows-msvc --locked

      - name: Stage executable for NativePHP extras
        if: ${{ steps.serial-agent-binary-cache.outputs.cache-hit != 'true' }}
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force extras/serial-agent
          Copy-Item serial-agent/target/x86_64-pc-windows-msvc/release/serial-agent.exe extras/serial-agent/serial-agent.exe

      - name: Verify staged serial-agent executable
        shell: pwsh
        run: |
          $agentPath = 'extras/serial-agent/serial-agent.exe'
          if (-not (Test-Path $agentPath -PathType Leaf)) {
            Write-Error "Missing staged serial agent at $agentPath"
            exit 1
          }

          $agent = Get-Item $agentPath
          if ($agent.Length -eq 0) {
            Write-Error "Staged serial agent is empty: $agentPath"
            exit 1
          }

          Write-Host "Using $agentPath ($($agent.Length) bytes); cache hit: ${{ steps.serial-agent-binary-cache.outputs.cache-hit }}"

      - name: Build frontend assets
        run: npm run build

      - name: Build NativePHP Windows app
        run: php artisan native:build win x64 --no-interaction

      - name: Upload serial-agent executable
        uses: actions/upload-artifact@v6
        with:
          name: serial-agent-win64
          path: nativephp/electron/dist/win-unpacked/extras/serial-agent/serial-agent.exe
          if-no-files-found: error

      - name: Upload NativePHP Windows app
        uses: actions/upload-artifact@v6
        with:
          name: nativephp-installer-with-serial-agent
          path: nativephp/electron/dist/Hlasovanie-*setup.exe
          if-no-files-found: error

      - name: Publish installer to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v3
        with:
          files: nativephp/electron/dist/Hlasovanie-*setup.exe
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
